name: Render and Publish

# Builds the Quarto book and publishes it to the gh-pages branch.
# Inert until this repo has a GitHub remote and Pages is enabled
# (Settings -> Pages -> Source: gh-pages branch).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Chromium (for shinytest2, used by the gate)
        uses: browser-actions/setup-chrome@v1

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # DESCRIPTION is a manifest-only file (see its Description field)
          extra-packages: any::sessioninfo

      - name: Book gate (must pass before publish)
        # The authoritative gate (boot / verbatim / symbols / screenshots /
        # shinylive) against the ggpaintr pinned in DESCRIPTION's Remotes.
        # Failing here aborts the job, so gh-pages never receives a book
        # that contradicts its fixtures. See dev/plans/book-workflow.md.
        run: Rscript dev/book-gate.R

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
