name: Book gate

# Authoritative gate for the ggpaintr book. Runs Rscript dev/book-gate.R against
# the pinned ggpaintr. Must pass before publish.yml will deploy.
#
# See CLAUDE.md and dev/plans/book-workflow.md for the gate definition.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Chromium (for shinytest2)
        uses: browser-actions/setup-chrome@v1

      - name: Install R dependencies (incl. pinned ggpaintr)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # DESCRIPTION is a manifest. Imports + Remotes resolves ggpaintr at
          # the pinned SHA/tag. setup-r-dependencies installs everything listed.
          extra-packages: any::sessioninfo

      - name: Run authoritative gate
        run: Rscript dev/book-gate.R
