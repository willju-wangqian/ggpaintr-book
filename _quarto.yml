project:
  type: book

book:
  title: "ggpaintr"
  subtitle: "Formula-Driven Shiny Plot Apps"
  author: "Wang Qian Ju"
  date: today
  repo-url: https://github.com/willju-wangqian/ggpaintr-book
  repo-branch: main
  repo-actions: [edit, issue]
  search: true
  sidebar:
    style: docked
  chapters:
    - index.qmd
    - introduction.qmd
    - part: "Your first app"
      chapters:
        - getting-started.qmd
    - part: "Writing formulas"
      chapters:
        - placeholders.qmd
        - formula-language.qmd
        - generated-code.qmd
    - part: "Custom placeholders"
      chapters:
        - custom-placeholders.qmd
        - custom-consumer-source.qmd
        - hook-contract.qmd
    - part: "ggpaintr in your own Shiny app"
      chapters:
        - embed-default.qmd
        - multi-plot.qmd
        - shared-placeholders.qmd
        - embed-bare.qmd
        - custom-render.qmd
    - part: "Making it yours"
      chapters:
        - customization.qmd
        - theming-wrappers.qmd
        - ui-text.qmd
    - part: "Sharing & advanced"
      chapters:
        - safety.qmd
        - llm.qmd
    - part: "Gallery"
      chapters:
        - gallery.qmd
    - references.qmd
  appendices:
    - cheatsheet.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    code-link: true
    code-copy: true

# Default chunk policy for the whole book. ggpaintr produces *interactive
# Shiny apps* that cannot render to static HTML, so example chunks are shown
# verbatim and NOT executed; the running UI is shown as a screenshot/GIF
# whose pair-hash matches the fixture under tests/fixtures/book-apps/<slug>/.
# Override per-chunk only for genuinely static output (e.g. the generated
# code string, the formula -> widget mapping). See book-conventions.md and
# dev/plans/book-workflow.md.
execute:
  eval: false
  echo: true
  warning: false
